# fly.toml app configuration file generated for tomography-sensitivity on 2026-06-24T20:36:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tomography-sensitivity'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/_stcore/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
