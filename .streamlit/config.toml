[server]
headless = true
address = "0.0.0.0"
port = 8501
# Fly's edge proxy terminates TLS and forwards to the container; the app is fully public
# and accepts no consequential uploads, so CORS/XSRF protection is disabled to avoid
# false-positive websocket rejections behind the proxy.
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[global]
# The solver-log box re-renders every 0.2 s while IPOPT runs, and each render is one
# components.html call. On Streamlit versions that have deprecated it in favour of st.iframe
# that is one deprecation warning per render, which buries the actual IPOPT log in the terminal
# at a rate of five per second. The call itself is still correct and still required: the log box
# needs its trailing <script> to auto-scroll, and st.html strips scripts. Silence the notice
# rather than break the box; revisit when the pinned Streamlit actually gains st.iframe.
suppressDeprecationWarnings = true
